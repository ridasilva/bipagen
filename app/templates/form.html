{% extends "base.html" %}
{% block title %}{{ _('Edit') if registro else _('New') }} {{ _('Record') }}{% endblock %}
{% block content %}
<h2>{{ _('Edit') if registro else _('New') }} {{ _('Microorganism Record') }}</h2>
<hr>
<form method="POST" class="row g-3">
    <div class="col-md-4">
        <label class="form-label">{{ _('Access Code') }} *</label>
        <input type="text" name="codigo_acesso" class="form-control" required value="{{ registro.codigo_acesso if registro else '' }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">{{ _('Type') }} *</label>
        <select name="tipo" class="form-select" required>
            <option value="">{{ _('Select...') }}</option>
            {% for t in ['Fungo', 'Bactéria', 'Levedura', 'Vírus'] %}
            <option value="{{ t }}" {{ 'selected' if registro and registro.tipo == t else '' }}>{{ _(t) }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <label class="form-label">{{ _('Genus') }} *</label>
        <input type="text" name="genero" class="form-control" required value="{{ registro.genero if registro else '' }}">
    </div>
    <div class="col-md-2">
        <label class="form-label">{{ _('Species') }} *</label>
        <input type="text" name="especie" class="form-control" required value="{{ registro.especie if registro else '' }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">{{ _('Strain') }}</label>
        <input type="text" name="cepa_strain" class="form-control" value="{{ registro.cepa_strain if registro else '' }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">{{ _('Isolation Source') }}</label>
        <input type="text" name="origem_isolamento" class="form-control" value="{{ registro.origem_isolamento if registro else '' }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">{{ _('Collection Site') }}</label>
        <input type="text" name="local_coleta" class="form-control" value="{{ registro.local_coleta if registro else '' }}">
    </div>
    <div class="col-md-3">
        <label class="form-label">{{ _('Isolation Date') }}</label>
        <input type="date" name="data_isolamento" class="form-control" value="{{ registro.data_isolamento if registro else '' }}">
    </div>
    <div class="col-md-3">
        <label class="form-label">{{ _('Culture Medium') }}</label>
        <input type="text" name="meio_cultivo" class="form-control" value="{{ registro.meio_cultivo if registro else '' }}">
    </div>
    <div class="col-md-3">
        <label class="form-label">{{ _('Preservation Method') }}</label>
        <input type="text" name="metodo_preservacao" class="form-control" value="{{ registro.metodo_preservacao if registro else '' }}">
    </div>
    <div class="col-md-3">
        <label class="form-label">{{ _('Storage Location') }}</label>
        <input type="text" name="local_armazenamento" class="form-control" value="{{ registro.local_armazenamento if registro else '' }}">
    </div>
    <div class="col-md-4">
        <label class="form-label">{{ _('Responsible') }}</label>
        <input type="text" name="responsavel" class="form-control" value="{{ registro.responsavel if registro else '' }}">
    </div>
    <div class="col-md-3">
        <label class="form-label">{{ _('Registration Date') }}</label>
        <input type="date" name="data_cadastro" class="form-control" value="{{ registro.data_cadastro if registro else '' }}">
    </div>
    <div class="col-md-3">
        <label class="form-label">{{ _('Status') }}</label>
        <select name="status" class="form-select">
            <option value="public" {{ 'selected' if (registro and registro.status == 'public') or not registro else '' }}>{{ _('Public') }}</option>
            <option value="private" {{ 'selected' if registro and registro.status == 'private' else '' }}>{{ _('Private') }}</option>
        </select>
    </div>
    <div class="col-12">
        <label class="form-label">{{ _('Observations') }}</label>
        <textarea name="observacoes" class="form-control" rows="3">{{ registro.observacoes if registro else '' }}</textarea>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-success"><i class="bi bi-check-circle"></i> {{ _('Save') }}</button>
        <a href="{{ url_for('main.listar') }}" class="btn btn-secondary">{{ _('Cancel') }}</a>
    </div>
</form>
{% endblock %}
