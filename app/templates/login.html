{% extends "base.html" %}
{% block title %}{{ _('Login') }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title h4 mb-3"><i class="bi bi-box-arrow-in-right"></i> {{ _('Login') }}</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">{{ _('Username') }}</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">{{ _('Password') }}</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">{{ _('Login') }}</button>
                </form>
                <hr>
                <p class="mb-0 text-center small">
                    {{ _("Don't have an account?") }} <a href="{{ url_for('main.registro') }}">{{ _('Register') }}</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
